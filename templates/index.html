<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Usuarios</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="top-bar">
    <a href="/admin" class="admin-button">Acceso Administrador</a>
  </div>
  <div class="login">
    <h1>Registro</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <p style="color: red; text-align: center;">{{ messages[0] }}</p>
      {% endif %}
    {% endwith %}
    <form method="post" action="/register">
      <input type="text" name="nombre" placeholder="Nombre completo" required>
      <input type="text" name="identificacion" placeholder="Identificación" required>
      <button type="submit" class="btn btn-primary btn-block btn-large">Registrarse</button>
    </form>
  </div>
</body>
</html>
