<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Votantes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <img src="{{ url_for('static', filename='img/python-logo.png') }}" class="logo-top-left">
    <div class="top-bar">
        <a href="/admin_login" class="admin-button">🔐 Admin Login</a>
    </div>

    <div class="login">
        <h1>Registro para Votación</h1>

        {% if mensaje %}
            <p class="alert">{{ mensaje }}</p>
        {% endif %}

        <form method="post" action="/">
            <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>
            <span id="errorNombre" style="color:red; display:none; font-size: 0.9em;">
                El nombre no puede contener números ni caracteres especiales.
            </span>

            <input type="number" name="identificacion" placeholder="Identificación" required>
            <button type="submit" class="btn btn-primary">Ingresar</button>
        </form>
    </div>

    <script>
        const nombreInput = document.getElementById("nombre");
        const errorNombre = document.getElementById("errorNombre");

        nombreInput.addEventListener("input", function () {
            const regex = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/;
            if (!regex.test(this.value)) {
                errorNombre.style.display = "block";
                this.setCustomValidity("Nombre inválido");
            } else {
                errorNombre.style.display = "none";
                this.setCustomValidity("");
            }
        });
    </script>
</body>
</html>
