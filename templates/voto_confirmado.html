<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Voto Guardado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }

        h1 {
            color: #333333;
            margin-bottom: 24px;
        }

        .success-message {
            color: #4CAF50;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            margin-top: 16px;
            color: #4CAF50;
            text-decoration: none;
            font-size: 1em;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Voto Registrado!</h1>
        <p class="success-message">Tu elección ha sido guardada correctamente.</p>
        <p>Gracias por participar.</p>
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
